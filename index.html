<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Sirius Leaf</title>
    
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="container">
      <section class="parallax-container">
        <h1 class="text-bg parallax-item" data-parallax-speed="0.4" data-x="50" data-y="50">Hello World!</h1>
        <h1 class="text-fg" data-x="50" data-y="50">Hello World!</h1>
      </section>
    </div>

    <div class="container">
      <section class="parallax-container">
        <h1 class="text-bg parallax-item" data-parallax-speed="0.4" data-x="90" data-y="80">Hello World!</h1>
        <h1 class="text-fg" data-x="50" data-y="50">Hello World!</h1>
      </section>
    </div>
  </main>
  
  <script src="main.js"></script>
</body>
</html>
